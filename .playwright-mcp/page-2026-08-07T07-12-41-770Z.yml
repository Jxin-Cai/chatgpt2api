            - option "All renderers"
            - option "Single renderer"
            - option "Single utility"
            - option "All utilities"
        - generic [ref=f4e1620]:
          - generic [ref=f4e1621]:
            - heading "Heap profiling sampling interval (in bytes)." [level=2] [ref=f4e1622]
            - paragraph [ref=f4e1623]:
              - generic [ref=f4e1624]: Heap profiling service uses Poisson process to sample allocations. Default value for the interval between samples is 1000000 (1MB). This results in low noise for large and/or frequent allocations [size * frequency >> 1MB]. This means that aggregate numbers [e.g. total size of malloc-ed objects] and large and/or frequent allocations can be trusted with high fidelity. Lower intervals produce higher samples resolution, but come at a cost of higher performance overhead.
              - text: –
              - generic [ref=f4e1625]: Mac, Windows, Linux, ChromeOS, Android
            - link "#memlog-sampling-rate" [ref=f4e1626] [cursor=pointer]:
              - /url: "#memlog-sampling-rate"

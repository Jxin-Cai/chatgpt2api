            - heading "Heap profiling stack traces type." [level=2] [ref=f4e1633]
            - paragraph [ref=f4e1634]:
              - generic [ref=f4e1635]: By default heap profiling service records native stacks. A post-processing step is required to symbolize the stacks. 'Native with thread names' adds the thread name as the first frame of each native stack. It's also possible to record a pseudo stack using trace events as identifiers. It's also possible to do a mix of both.
              - text: –

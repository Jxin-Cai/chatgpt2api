            - heading "Chrome heap profiler start mode." [level=2] [ref=f4e1611]
            - paragraph [ref=f4e1612]:
              - generic [ref=f4e1613]: Starts heap profiling service that records sampled memory allocation profile having each sample attributed with a callstack. The sampling resolution is controlled with --memlog-sampling-rate flag. Recorded heap dumps can be obtained at chrome://tracing [category:memory-infra] and chrome://memory-internals. This setting controls which processes will be profiled since their start. To profile any given process at a later time use chrome://memory-internals page.
              - text: –
              - generic [ref=f4e1614]: Mac, Windows, Linux, ChromeOS, Android
            - link "#memlog" [ref=f4e1615] [cursor=pointer]:
              - /url: "#memlog"
